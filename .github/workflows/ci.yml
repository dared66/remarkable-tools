name: reMail checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: mail/go.mod
          cache-dependency-path: mail/go.sum
      - name: Backend checks
        working-directory: mail
        run: |
          go test ./...
          go vet ./...
      - name: Account and Keychain adapter checks (fake services only)
        run: python3 -m unittest discover -s mail/tests
      - name: ARMv7 compilation
        working-directory: mail
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -mod=readonly -trimpath -buildvcs=false -o /tmp/remarkmail-arm ./cmd/remarkmail
